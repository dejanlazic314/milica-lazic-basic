# Password for the shared link (ddev share): every host except *.ddev.site asks for it,
# so the local site stays open and the tunnel address is protected.
# The password file is not in git. Create it in the project folder (asks for the password):
#   ddev exec htpasswd -nB gost > .ddev/share.htpasswd
# Without the file the tunnel answers with an error, never with the site.
set $share_auth "Milica Lazic - probna verzija";
if ($host ~* \.ddev\.site$) {
    set $share_auth off;
}
auth_basic $share_auth;
auth_basic_user_file /mnt/ddev_config/share.htpasswd;
